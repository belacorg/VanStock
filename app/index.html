<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Van Stock">
  <title>Van Stock</title>
  <link rel="manifest" href="manifest.json">
  <!-- iOS ignores the manifest's icons; with no apple-touch-icon it builds the
       home-screen icon from a screenshot of the page. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!--
    Fonts are served from this origin, not fonts.googleapis.com. This app is
    opened standing at the back doors of a van, often on one bar of signal in a
    cellar or a multi-storey car park, and a typeface that only arrives online
    is the wrong kind of dependency for that. Same call as CTAP Tracker.
  -->
  <link rel="preload" href="fonts/DMSans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css?v=7">
  <link rel="stylesheet" href="style.css?v=7">
  <script>if(localStorage.getItem('vs_theme')==='light')document.documentElement.style.background='#f2f2f7';</script>
</head>
<body>
  <div id="app"></div>
  <!--
    Local-only. The van stock list is this engineer's own record of what is in
    their own van; it never leaves the device and there is no account to sync it
    to. Backup is the JSON export in Settings.
  -->
  <script src="data.cjs?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
